name: playbilld
description: "Letterboxd for Broadway performances."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'

dependencies:
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: any # Version pinned by flutter_localizations in the Flutter SDK
  material_ui: ^1.11.0
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  network_image_mock: ^2.1.1
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  # Add assets here when ready, e.g.:
  # assets:
  #   - assets/images/
